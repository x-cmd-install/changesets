{"id":460939185,"author":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOCo1SFM4beV-x","tag_name":"@changesets/cli@3.1.0","target_commitish":"main","name":"@changesets/cli@3.1.0","draft":false,"immutable":true,"prerelease":false,"created_at":"2026-11-27T18:08:15Z","updated_at":"2026-11-27T18:23:15Z","published_at":"2026-11-27T18:23:15Z","assets":[],"body":"### Minor Changes\n\n- [#2346](https://github.com/changesets/changesets/pull/2346) [`b09779a`](https://github.com/changesets/changesets/commit/b09779a3d503a581df98a81384d5849db969eb03) Thanks [@Netail](https://github.com/Netail)! - Added support for formatting with [Biome](https://biomejs.dev/) (version 2.6+).\n\n- [#2183](https://github.com/changesets/changesets/pull/2183) [`bb2ff9b`](https://github.com/changesets/changesets/commit/bb2ff9b1cc8dc12c11eb323f1ac3b26339edf43d) Thanks [@Andarist](https://github.com/Andarist)! - Add support for staging packages for approval before they go live on npm. You can enable it with `\"stagedPublishing\": true` in your Changesets config or by running `changeset publish --stage`. If staging is enabled in your config, you can use `--no-stage` to publish directly.\n\n- [#2365](https://github.com/changesets/changesets/pull/2365) [`1ed9edd`](https://github.com/changesets/changesets/commit/1ed9edda6ed9e7576afea79503b593bba8cd2d9b) Thanks [@beeequeue](https://github.com/beeequeue)! - Now reads frontmatter metadata and passes it to changelog formatter functions:\n\n  ```markdown\n  ---\n  foo: minor\n  _:\n    your: \"metadata here\"\n    any: yaml\n    number: 123\n  ---\n\n  Something changed!\n  ```\n\n  ```ts\n  export default {\n    getReleaseLine: (changeset, changeType, options) => {\n      // { your: \"metadata here\", any: \"yaml\", number: 123 }\n      console.log(changeset.metadata);\n    },\n  };\n  ```\n\n### Patch Changes\n\n- [#2387](https://github.com/changesets/changesets/pull/2387) [`06548ad`](https://github.com/changesets/changesets/commit/06548adc8461e3e3754def2efcafa556f091af71) Thanks [@mixelburg](https://github.com/mixelburg)! - Fixed `remoteTagExists` matching the end instead of full names.\n\n  e.g. `shacl-playground` would also match `@zazuko/shacl-playground`, which it shouldn't.\n\n- Updated dependencies [[`b09779a`](https://github.com/changesets/changesets/commit/b09779a3d503a581df98a81384d5849db969eb03), [`06548ad`](https://github.com/changesets/changesets/commit/06548adc8461e3e3754def2efcafa556f091af71), [`bb2ff9b`](https://github.com/changesets/changesets/commit/bb2ff9b1cc8dc12c11eb323f1ac3b26339edf43d), [`1ed9edd`](https://github.com/changesets/changesets/commit/1ed9edda6ed9e7576afea79503b593bba8cd2d9b), [`1ed9edd`](https://github.com/changesets/changesets/commit/1ed9edda6ed9e7576afea79503b593bba8cd2d9b)]:\n  - @changesets/config@4.1.0\n  - @changesets/types@7.1.0\n  - @changesets/write@1.1.0\n  - @changesets/git@4.0.2\n  - @changesets/apply-release-plan@8.2.0\n  - @changesets/assemble-release-plan@7.1.0\n  - @changesets/read@1.1.0\n  - @changesets/changelog-git@1.0.1\n  - @changesets/get-dependents-graph@3.0.1\n  - @changesets/pre@3.0.1\n  - @changesets/should-skip-package@1.0.1"}
